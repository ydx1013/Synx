name = "synx-sync-worker"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# D1 数据库（版本元数据、用户、存储配置）
[[d1_databases]]
binding = "DB"
database_name = "synx-sync-db"
database_id = "d67997f9-571c-4893-9220-3119de2d5d77"

# KV 命名空间（token 缓存、目录索引缓存）
[[kv_namespaces]]
binding = "KV"
id = "14c525bf63e848a1a3102768d1267e79"

# R2 存储桶（可选，Workers 端自有存储；第一版用用户自带 S3）
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "synx-sync-bucket"

# 环境变量（本地开发用 .dev.vars，生产用 wrangler secret）
[vars]
ENVIRONMENT = "production"
# JWT_SECRET 与 ENCRYPTION_KEY 在 .dev.vars / wrangler secret 中设置

# 静态资源（Web UI）
[assets]
directory = "../web"
binding = "ASSETS"
run_worker_first = true
